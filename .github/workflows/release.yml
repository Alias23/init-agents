name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create checksum
        run: sha256sum init-agents > init-agents.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            init-agents \
            init-agents.sha256 \
            --title "init-agents $GITHUB_REF_NAME" \
            --generate-notes
