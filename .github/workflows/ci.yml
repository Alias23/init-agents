name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck init-agents test/init-agents-test.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bash 5 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Add Homebrew Bash to PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml
      - name: Show versions
        run: |
          bash --version | head -n 1
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Bash syntax
        run: |
          bash -n init-agents
          bash -n test/init-agents-test.sh
      - name: Functional tests
        run: bash test/init-agents-test.sh
